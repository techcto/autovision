<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>AutoVision / AWS deployment architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#ed3049"/></marker></defs><rect width="1800" height="1200" fill="#101114"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="70" y="90" fill="white" font-size="44" font-weight="700">AutoVision / AWS deployment architecture</text><text x="70" y="140" fill="#b7bac3" font-size="23">Standalone service • hosted SaaS or private AWS account • logical architecture, not a packet-level network map</text><rect x="70" y="205" width="380" height="150" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="94" y="247" fill="white" font-size="26" font-weight="700">Applications + agents</text><text x="94" y="287" fill="#c8cbd3" font-size="21">Web console / REST / MCP</text><text x="94" y="317" fill="#c8cbd3" font-size="21" textLength="332" lengthAdjust="spacingAndGlyphs">Organization-scoped credentials</text><rect x="560" y="205" width="470" height="150" rx="16" fill="#301720" stroke="#ed3049" stroke-width="2"/><text x="584" y="247" fill="white" font-size="26" font-weight="700" textLength="422" lengthAdjust="spacingAndGlyphs">HTTPS Application Load Balancer</text><text x="584" y="287" fill="#c8cbd3" font-size="21">Web UI + API + MCP routing</text><text x="584" y="317" fill="#c8cbd3" font-size="21">Health-based service routing</text><rect x="1140" y="205" width="590" height="150" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="1164" y="247" fill="white" font-size="26" font-weight="700">Deployment + operations</text><text x="1164" y="287" fill="#c8cbd3" font-size="21">CloudFormation / IAM / Secrets Manager</text><text x="1164" y="317" fill="#c8cbd3" font-size="21">CloudWatch logs + structured traces</text><polyline points="450,280 550,280" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="455" width="380" height="180" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="94" y="497" fill="white" font-size="26" font-weight="700">Web / Fargate</text><text x="94" y="537" fill="#c8cbd3" font-size="21">Next.js + React console</text><text x="94" y="567" fill="#c8cbd3" font-size="21">Uploads, jobs and settings</text><text x="94" y="597" fill="#c8cbd3" font-size="21" textLength="332" lengthAdjust="spacingAndGlyphs">Browser samples bounded video</text><rect x="560" y="455" width="560" height="180" rx="16" fill="#301720" stroke="#ed3049" stroke-width="2"/><text x="584" y="497" fill="white" font-size="26" font-weight="700">API / Fargate</text><text x="584" y="537" fill="#c8cbd3" font-size="21">Tenant auth, quota and job orchestration</text><text x="584" y="567" fill="#c8cbd3" font-size="21">Bedrock Decider + vision sidecar</text><text x="584" y="597" fill="#c8cbd3" font-size="21">Private COOL backend can replace sidecar</text><rect x="1240" y="455" width="490" height="180" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="1264" y="497" fill="white" font-size="26" font-weight="700">Amazon Bedrock</text><text x="1264" y="537" fill="#c8cbd3" font-size="21">Approved planner + assessment models</text><text x="1264" y="567" fill="#c8cbd3" font-size="21">Optional consented image delegation</text><text x="1264" y="597" fill="#c8cbd3" font-size="21" textLength="442" lengthAdjust="spacingAndGlyphs">Structured tool results, not hidden reasoning</text><polyline points="690,355 690,395 260,395 260,445" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="840,355 840,445" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1120,540 1230,540" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><text x="1135" y="520" fill="#ff8c9c" font-size="19">model calls</text><rect x="70" y="760" width="380" height="170" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="94" y="802" fill="white" font-size="26" font-weight="700">DynamoDB + private S3</text><text x="94" y="842" fill="#c8cbd3" font-size="21" textLength="332" lengthAdjust="spacingAndGlyphs">Tenant jobs / settings / usage</text><text x="94" y="872" fill="#c8cbd3" font-size="21" textLength="332" lengthAdjust="spacingAndGlyphs">Bounded previews + evidence where used</text><text x="94" y="902" fill="#c8cbd3" font-size="21" textLength="332" lengthAdjust="spacingAndGlyphs">Retention and access controls</text><rect x="560" y="760" width="360" height="170" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="584" y="802" fill="white" font-size="26" font-weight="700" textLength="312" lengthAdjust="spacingAndGlyphs">SQS + dead-letter queue</text><text x="584" y="842" fill="#c8cbd3" font-size="21" textLength="312" lengthAdjust="spacingAndGlyphs">Asynchronous incident path</text><text x="584" y="872" fill="#c8cbd3" font-size="21" textLength="312" lengthAdjust="spacingAndGlyphs">Not every vision request uses SQS</text><rect x="1030" y="760" width="360" height="170" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="1054" y="802" fill="white" font-size="26" font-weight="700">Worker / Fargate</text><text x="1054" y="842" fill="#c8cbd3" font-size="21" textLength="312" lengthAdjust="spacingAndGlyphs">Background incident processing</text><text x="1054" y="872" fill="#c8cbd3" font-size="21" textLength="312" lengthAdjust="spacingAndGlyphs">OpenCV sidecar / optional AI</text><text x="1054" y="902" fill="#c8cbd3" font-size="21">Configured notifications</text><rect x="1460" y="760" width="270" height="170" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="1484" y="802" fill="white" font-size="26" font-weight="700">Optional COOL</text><text x="1484" y="842" fill="#c8cbd3" font-size="21" textLength="222" lengthAdjust="spacingAndGlyphs">Private licensed backend</text><text x="1484" y="872" fill="#c8cbd3" font-size="21" textLength="222" lengthAdjust="spacingAndGlyphs">Graviton / Arm execution</text><text x="1484" y="902" fill="#c8cbd3" font-size="21" textLength="222" lengthAdjust="spacingAndGlyphs">Separate host + evidence</text><polyline points="650,635 650,690 270,690 270,750" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="840,635 840,750" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="920,845 1020,845" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1120,625 1170,625 1170,700 1595,700 1595,750" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><text x="1320" y="684" fill="#ff8c9c" font-size="19">selected backend</text><text x="70" y="1010" fill="#b7bac3" font-size="21">Standard mode: bundled OpenCV 5 sidecars. COOL mode: separately provisioned compatible private service.</text><text x="70" y="1055" fill="#b7bac3" font-size="21">Private-install templates and delivery tooling are built and contract-tested. AutoVision Marketplace listing: coming soon.</text><text x="70" y="1100" fill="#b7bac3" font-size="21">COOL configuration is not proof of acceleration. Submit actual runtime, Graviton workload trace and baseline comparison.</text></g></svg>