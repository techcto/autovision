<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img"><title>AutoVision / evidence-driven agent inspection</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#ed3049"/></marker></defs><rect width="1800" height="1200" fill="#101114"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="70" y="90" fill="white" font-size="44" font-weight="700">AutoVision / evidence-driven agent inspection</text><text x="70" y="140" fill="#b7bac3" font-size="23">OpenCV measures → Decider chooses → tool executes → returned evidence informs the next step</text><rect x="70" y="210" width="400" height="170" rx="16" fill="#301720" stroke="#ed3049" stroke-width="2"/><text x="94" y="252" fill="white" font-size="26" font-weight="700">1 / PERCEIVE</text><text x="94" y="292" fill="#c8cbd3" font-size="21" textLength="352" lengthAdjust="spacingAndGlyphs">Consented image or sampled frames</text><text x="94" y="322" fill="#c8cbd3" font-size="21" textLength="352" lengthAdjust="spacingAndGlyphs">OpenCV 5: objects, motion, brightness</text><text x="94" y="352" fill="#c8cbd3" font-size="21">Keep initial evidence</text><rect x="600" y="210" width="500" height="170" rx="16" fill="#301720" stroke="#ed3049" stroke-width="2"/><text x="624" y="252" fill="white" font-size="26" font-weight="700">2 / DECIDE</text><text x="624" y="292" fill="#c8cbd3" font-size="21" textLength="452" lengthAdjust="spacingAndGlyphs">Trigger policy + approved tool catalog</text><text x="624" y="322" fill="#c8cbd3" font-size="21" textLength="452" lengthAdjust="spacingAndGlyphs">Bedrock evaluates accumulated evidence</text><text x="624" y="352" fill="#c8cbd3" font-size="21" textLength="452" lengthAdjust="spacingAndGlyphs">Choose frame, region or assessment focus</text><rect x="1230" y="210" width="500" height="170" rx="16" fill="#301720" stroke="#ed3049" stroke-width="2"/><text x="1254" y="252" fill="white" font-size="26" font-weight="700">3 / ACT: inspect deeper</text><text x="1254" y="292" fill="#c8cbd3" font-size="21">Validated allowlisted tool call</text><text x="1254" y="322" fill="#c8cbd3" font-size="21" textLength="452" lengthAdjust="spacingAndGlyphs">Frame / region / consent / quota checks</text><text x="1254" y="352" fill="#c8cbd3" font-size="21" textLength="452" lengthAdjust="spacingAndGlyphs">No arbitrary commands or external actions</text><polyline points="470,295 590,295" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1100,295 1220,295" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="525" width="470" height="180" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="94" y="567" fill="white" font-size="26" font-weight="700">Crop + re-detect</text><text x="94" y="607" fill="#c8cbd3" font-size="21">inspect_region</text><text x="94" y="637" fill="#c8cbd3" font-size="21">Crop an existing OpenCV detection</text><text x="94" y="667" fill="#c8cbd3" font-size="21" textLength="422" lengthAdjust="spacingAndGlyphs">Rerun pinned YOLOX; preserve context</text><rect x="665" y="525" width="470" height="180" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="689" y="567" fill="white" font-size="26" font-weight="700">Enhance + remeasure</text><text x="689" y="607" fill="#c8cbd3" font-size="21">enhance_low_light</text><text x="689" y="637" fill="#c8cbd3" font-size="21" textLength="422" lengthAdjust="spacingAndGlyphs">Bounded CLAHE luminance enhancement</text><text x="689" y="667" fill="#c8cbd3" font-size="21" textLength="422" lengthAdjust="spacingAndGlyphs">Rerun YOLOX; missing detail stays missing</text><rect x="1260" y="525" width="470" height="180" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="1284" y="567" fill="white" font-size="26" font-weight="700">Focused model assessment</text><text x="1284" y="607" fill="#c8cbd3" font-size="21">assess_scene</text><text x="1284" y="637" fill="#c8cbd3" font-size="21">Scene / package / activity lens</text><text x="1284" y="667" fill="#c8cbd3" font-size="21" textLength="422" lengthAdjust="spacingAndGlyphs">Resolves to an operator-approved model</text><polyline points="1480,380 1480,455 305,455 305,515" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1480,455 900,455 900,515" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1480,455 1495,515" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><rect x="600" y="845" width="600" height="140" rx="16" fill="#301720" stroke="#ed3049" stroke-width="2"/><text x="624" y="887" fill="white" font-size="26" font-weight="700">4 / EVALUATE ACTUAL TOOL RESULTS</text><text x="624" y="927" fill="#c8cbd3" font-size="21" textLength="552" lengthAdjust="spacingAndGlyphs">Measurements return to the Decider before next turn</text><text x="624" y="957" fill="#c8cbd3" font-size="21" textLength="552" lengthAdjust="spacingAndGlyphs">Another tool if useful and within the remaining budget</text><polyline points="305,705 305,790 720,790 720,835" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="900,705 900,835" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1495,705 1495,790 1080,790 1080,835" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><polyline points="600,920 35,920 35,180 850,180 850,200" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><text x="95" y="894" fill="#ff8c9c" font-size="19">Evidence feedback: add a useful next step</text><rect x="1290" y="845" width="440" height="140" rx="16" fill="#202229" stroke="#50535f" stroke-width="2"/><text x="1314" y="887" fill="white" font-size="26" font-weight="700">FINISH / HUMAN CONTROL</text><text x="1314" y="927" fill="#c8cbd3" font-size="21">Advisory review recommendation</text><text x="1314" y="957" fill="#c8cbd3" font-size="21" textLength="392" lengthAdjust="spacingAndGlyphs">Failures retain evidence and request review</text><polyline points="1200,915 1280,915" fill="none" stroke="#ed3049" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="1050" fill="#b7bac3" font-size="21">Bounded internal loop: ≤2 follow-ups • ≤3 planner calls • 35-second inspection budget, plus initial analysis.</text><text x="70" y="1095" fill="#b7bac3" font-size="21">Models are configured per lens—not arbitrary model downloads, autonomous retraining or a performance bake-off.</text><text x="70" y="1140" fill="#b7bac3" font-size="21">No trigger ≠ safe or empty. External agents composing individual MCP tools own their own cross-call budget.</text></g></svg>