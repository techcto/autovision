{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "AutoVision attached to an existing ECS cluster and ALB listener",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "ImageBase": {
      "Type": "String",
      "Description": "ECR registry/repository prefix without service suffix"
    },
    "ReleaseVersion": {
      "Type": "String",
      "AllowedPattern": "[0-9A-Za-z.-]+",
      "Description": "Immutable published image tag"
    },
    "RootUsername": {
      "Type": "String",
      "Default": "root",
      "MinLength": 3
    },
    "RootPassword": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 12
    },
    "SessionSecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 32
    },
    "DeploymentMode": {
      "Type": "String",
      "Default": "on-premise",
      "AllowedValues": [
        "on-premise",
        "saas"
      ]
    },
    "DesiredCount": {
      "Type": "Number",
      "Default": 1,
      "MinValue": 1
    },
    "StripeSecretKey": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^(sk|rk)_(live|test)_[a-zA-Z0-9]+$",
      "Description": "Optional initial Stripe secret key. Stored in a retained Secrets Manager secret, never a task definition environment value. Prefer an existing secret ARN for enterprise installs."
    },
    "StripeWebhookSecret": {
      "Type": "String",
      "NoEcho": true,
      "Default": "",
      "AllowedPattern": "^$|^whsec_[a-zA-Z0-9]+$",
      "Description": "Stripe webhook signing secret paired with StripeSecretKey. Stored in Secrets Manager."
    },
    "StripeStarterPriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeScalePriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeImageOveragePriceId": {
      "Type": "String",
      "Default": "",
      "Description": "Metered per-image overage price on autovision_image_units_v1 (setup-plans.mjs). Must be from the same Stripe mode as StripeSecretKey."
    },
    "StripeAIOveragePriceId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional metered AI credit overage price on autovision_ai_credits_v1."
    },
    "UsageExport": {
      "Type": "String",
      "Default": "disabled",
      "AllowedValues": [
        "disabled",
        "enabled"
      ],
      "Description": "Enable opted-in overage and Stripe meter export (SaaS). Keep disabled until overage prices, credit weights and customer terms are approved and tested in Stripe test mode."
    },
    "AICreditWeights": {
      "Type": "String",
      "Default": "",
      "Description": "Optional versioned AI credit weights JSON with included_credits per plan. Empty leaves AI usage unpriced and unbilled."
    },
    "SesFrom": {
      "Type": "String",
      "Default": "",
      "Description": "SES-verified sender in the deployment region. Required for SaaS verification, e.g. noreply@autovision.dev."
    },
    "WhatsappOriginationId": {
      "Type": "String",
      "Default": ""
    },
    "NotificationRecipients": {
      "Type": "String",
      "Default": ""
    },
    "Cluster": {
      "Type": "String"
    },
    "LoadBalancerSecurityGroup": {
      "Type": "AWS::EC2::SecurityGroup::Id"
    },
    "ListenerArn": {
      "Type": "String"
    },
    "HostHeader": {
      "Type": "String",
      "Default": "autovision.dev"
    },
    "WebListenerPriority": {
      "Type": "Number",
      "Default": 301,
      "MinValue": 1,
      "MaxValue": 49999
    },
    "ApiListenerPriority": {
      "Type": "Number",
      "Default": 300,
      "MinValue": 1,
      "MaxValue": 49999
    },
    "AIModelRegistry": {
      "Type": "String",
      "Default": "",
      "Description": "Optional operator-approved AI model registry JSON. Verify image/tool support, region, cost and IAM separately; does not provision model access."
    },
    "BedrockModelId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional Bedrock model/inference-profile ID for enrichment"
    },
    "BedrockModelArn": {
      "Type": "String",
      "Default": "",
      "Description": "ARN authorized for bedrock:InvokeModel; include inference profiles as required"
    },
    "CertificateArn": {
      "Type": "String",
      "Default": "",
      "Description": "Optional issued ACM certificate in this region, added to the existing HTTPS listener."
    },
    "HostedZoneId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional public Route 53 zone for HostHeader."
    },
    "LoadBalancerDnsName": {
      "Type": "String",
      "Default": "",
      "Description": "Existing ALB DNS name, required with HostedZoneId."
    },
    "LoadBalancerCanonicalHostedZoneId": {
      "Type": "String",
      "Default": "",
      "Description": "Existing ALB canonical hosted zone ID, required with HostedZoneId."
    },
    "MarketplaceUrl": {
      "Type": "String",
      "Default": "https://aws.amazon.com/marketplace/pp/prodview-f4z2vbrqoh55u",
      "AllowedPattern": "^$|^https://aws\\.amazon\\.com/marketplace/[^\\s]+$",
      "Description": "Buyer-facing Marketplace listing URL. Leave empty to hide the subscription button."
    },
    "EventBridgeEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Use EventBridge to deliver incidents. Set false for direct SQS delivery."
    },
    "VisionAIEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Enable Nova Lite scene grounding; incurs bounded per-request Bedrock charges. US inference profile; deploy in us-east-1."
    },
    "PublicDemoEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Enable anonymous bounded image/video sample analysis"
    },
    "PublicDemoDailyLimit": {
      "Type": "Number",
      "Default": 100,
      "MinValue": 1,
      "MaxValue": 10000
    },
    "VisionBackend": {
      "Type": "String",
      "Default": "standard",
      "AllowedValues": [
        "standard",
        "cool"
      ],
      "Description": "standard uses the bundled OpenCV vision sidecar; cool uses a separately provisioned, licensed COOL/Graviton service. No automatic Marketplace subscription."
    },
    "CoolVisionUrl": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$",
      "Description": "Private base URL of a verified COOL service implementing /analyze and /detect. Restrict network access to app task security groups. Required only for cool."
    },
    "StripeCredentialsSecretArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[a-zA-Z0-9/_+=.@-]+$",
      "Description": "Optional existing same-account, same-region Stripe JSON secret ARN. Keys: secret_key and webhook_secret. Leave raw Stripe parameters empty when supplied."
    },
    "StripeCredentialsKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$",
      "Description": "Optional customer-managed KMS key ARN for the Stripe secret. Key policy must permit the task execution role to decrypt."
    },
    "StripeCredentialsRevision": {
      "Type": "String",
      "Default": "1",
      "AllowedPattern": "[a-zA-Z0-9.-]+",
      "Description": "Increment after rotating Stripe credentials to roll tasks through a reviewed CloudFormation change set."
    },
    "CoreSecretsKmsKeyArn": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^arn:aws[a-z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-zA-Z0-9-]+$",
      "Description": "Optional customer-managed KMS key for root, session and provider secrets. Key policy must permit the execution role to decrypt."
    },
    "CoreSecretsRevision": {
      "Type": "String",
      "Default": "1",
      "AllowedPattern": "[a-zA-Z0-9.-]+",
      "Description": "Increment after changing root or session secrets to roll tasks through a reviewed CloudFormation change set."
    },
    "PublicOrigin": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^https://[a-zA-Z0-9.-]+(?::[0-9]+)?$",
      "Description": "Canonical HTTPS site origin for verification/password-reset links. Required in SaaS mode, e.g. https://autovision.dev."
    },
    "BlockedSignupDomains": {
      "Type": "String",
      "Default": "",
      "MaxLength": 2048,
      "Description": "Optional comma-separated domains blocked for new accounts, e.g. gmail.com,googlemail.com. Empty allows all domains."
    },
    "StripeMode": {
      "Type": "String",
      "Default": "live",
      "AllowedValues": [
        "live",
        "sandbox"
      ],
      "Description": "Stripe environment. Use live keys in production and sandbox keys only in isolated test deployments."
    }
  },
  "Resources": {
    "ServiceSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "AutoVision application tasks",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 3000,
            "ToPort": 3001,
            "SourceSecurityGroupId": {
              "Ref": "LoadBalancerSecurityGroup"
            }
          }
        ]
      }
    },
    "WebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      }
    },
    "ApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      }
    },
    "Queue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 120,
        "MessageRetentionPeriod": 345600,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DeadLetterQueue",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "DeadLetterQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600
      }
    },
    "AppTable": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "sk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1sk",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "pk",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "sk",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [
              {
                "AttributeName": "gsi1pk",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "gsi1sk",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "ttl",
          "Enabled": true
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "EvidenceBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        }
      }
    },
    "EventBus": {
      "Type": "AWS::Events::EventBus",
      "Properties": {
        "Name": {
          "Fn::Sub": "${AWS::StackName}-events"
        }
      },
      "Condition": "UseEventBridge"
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 30
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
          }
        ],
        "Policies": [
          {
            "Fn::If": [
              "UseStripeCredentials",
              {
                "PolicyName": "stripe-credentials-read",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "secretsmanager:GetSecretValue",
                      "Resource": {
                        "Fn::If": [
                          "UseExternalStripeSecret",
                          {
                            "Ref": "StripeCredentialsSecretArn"
                          },
                          {
                            "Ref": "StripeCredentials"
                          }
                        ]
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "Fn::If": [
              "UseStripeKmsAccess",
              {
                "PolicyName": "stripe-key-decrypt",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "kms:Decrypt",
                      "Resource": {
                        "Ref": "StripeCredentialsKmsKeyArn"
                      },
                      "Condition": {
                        "StringEquals": {
                          "kms:ViaService": {
                            "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                          },
                          "kms:EncryptionContext:SecretARN": {
                            "Fn::If": [
                              "UseExternalStripeSecret",
                              {
                                "Ref": "StripeCredentialsSecretArn"
                              },
                              {
                                "Ref": "StripeCredentials"
                              }
                            ]
                          }
                        }
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          },
          {
            "PolicyName": "core-secrets-read",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "secretsmanager:GetSecretValue",
                  "Resource": [
                    {
                      "Ref": "RootPasswordSecret"
                    },
                    {
                      "Ref": "SessionSigningSecret"
                    }
                  ]
                }
              ]
            }
          },
          {
            "Fn::If": [
              "UseCoreSecretsKmsKey",
              {
                "PolicyName": "core-secrets-decrypt",
                "PolicyDocument": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Action": "kms:Decrypt",
                      "Resource": {
                        "Ref": "CoreSecretsKmsKeyArn"
                      },
                      "Condition": {
                        "StringEquals": {
                          "kms:ViaService": {
                            "Fn::Sub": "secretsmanager.${AWS::Region}.${AWS::URLSuffix}"
                          },
                          "kms:EncryptionContext:SecretARN": [
                            {
                              "Ref": "RootPasswordSecret"
                            },
                            {
                              "Ref": "SessionSigningSecret"
                            }
                          ]
                        }
                      }
                    }
                  ]
                }
              },
              {
                "Ref": "AWS::NoValue"
              }
            ]
          }
        ]
      }
    },
    "TaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "autovision-data",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:Query",
                    "dynamodb:UpdateItem"
                  ],
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "AppTable",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::Sub": "${AppTable.Arn}/index/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "sqs:SendMessage",
                    "sqs:ReceiveMessage",
                    "sqs:DeleteMessage",
                    "sqs:GetQueueAttributes"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "Queue",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${EvidenceBucket.Arn}/*"
                  }
                },
                {
                  "Fn::If": [
                    "UseEventBridge",
                    {
                      "Effect": "Allow",
                      "Action": "events:PutEvents",
                      "Resource": {
                        "Fn::GetAtt": [
                          "EventBus",
                          "Arn"
                        ]
                      }
                    },
                    {
                      "Ref": "AWS::NoValue"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ses:SendEmail",
                    "social-messaging:SendWhatsAppMessage"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ]
      }
    },
    "WebTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "256",
        "Memory": "512",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "web",
            "Image": {
              "Fn::Sub": "${ImageBase}-web:${ReleaseVersion}"
            },
            "Essential": true,
            "PortMappings": [
              {
                "ContainerPort": 3000
              }
            ],
            "Environment": [
              {
                "Name": "NODE_ENV",
                "Value": "production"
              },
              {
                "Name": "AUTOVISION_TABLE",
                "Value": {
                  "Ref": "AppTable"
                }
              },
              {
                "Name": "AUTOVISION_DEPLOYMENT_MODE",
                "Value": {
                  "Ref": "DeploymentMode"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_USER",
                "Value": {
                  "Ref": "RootUsername"
                }
              },
              {
                "Name": "AUTOVISION_QUEUE_URL",
                "Value": {
                  "Ref": "Queue"
                }
              },
              {
                "Name": "AUTOVISION_EVIDENCE_BUCKET",
                "Value": {
                  "Ref": "EvidenceBucket"
                }
              },
              {
                "Fn::If": [
                  "UseEventBridge",
                  {
                    "Name": "AUTOVISION_EVENT_BUS",
                    "Value": {
                      "Ref": "EventBus"
                    }
                  },
                  {
                    "Ref": "AWS::NoValue"
                  }
                ]
              },
              {
                "Name": "STRIPE_STARTER_PRICE_ID",
                "Value": {
                  "Ref": "StripeStarterPriceId"
                }
              },
              {
                "Name": "STRIPE_SCALE_PRICE_ID",
                "Value": {
                  "Ref": "StripeScalePriceId"
                }
              },
              {
                "Name": "STRIPE_IMAGE_OVERAGE_PRICE_ID",
                "Value": {
                  "Ref": "StripeImageOveragePriceId"
                }
              },
              {
                "Name": "STRIPE_AI_OVERAGE_PRICE_ID",
                "Value": {
                  "Ref": "StripeAIOveragePriceId"
                }
              },
              {
                "Name": "AUTOVISION_USAGE_EXPORT",
                "Value": {
                  "Ref": "UsageExport"
                }
              },
              {
                "Name": "AUTOVISION_AI_CREDIT_WEIGHTS_JSON",
                "Value": {
                  "Ref": "AICreditWeights"
                }
              },
              {
                "Name": "AUTOVISION_SES_FROM",
                "Value": {
                  "Ref": "SesFrom"
                }
              },
              {
                "Name": "AUTOVISION_WHATSAPP_ORIGINATION_ID",
                "Value": {
                  "Ref": "WhatsappOriginationId"
                }
              },
              {
                "Name": "AUTOVISION_NOTIFICATION_RECIPIENTS",
                "Value": {
                  "Ref": "NotificationRecipients"
                }
              },
              {
                "Name": "PORT",
                "Value": "3000"
              },
              {
                "Name": "BEDROCK_MODEL_ID",
                "Value": {
                  "Ref": "BedrockModelId"
                }
              },
              {
                "Name": "AUTOVISION_NOTIFICATION_MODE",
                "Value": "aws"
              },
              {
                "Name": "AUTOVISION_MARKETPLACE_URL",
                "Value": {
                  "Ref": "MarketplaceUrl"
                }
              },
              {
                "Name": "AUTOVISION_AI_MODELS_JSON",
                "Value": {
                  "Ref": "AIModelRegistry"
                }
              },
              {
                "Name": "AUTOVISION_VISION_MODEL_ID",
                "Value": {
                  "Fn::If": [
                    "UseVisionAI",
                    "us.amazon.nova-lite-v1:0",
                    ""
                  ]
                }
              },
              {
                "Name": "AUTOVISION_AI_DETECTIONS",
                "Value": "person,dog,cat,bird,car,bicycle,motorcycle,truck,package"
              },
              {
                "Name": "AUTOVISION_PUBLIC_DEMO_ENABLED",
                "Value": {
                  "Ref": "PublicDemoEnabled"
                }
              },
              {
                "Name": "AUTOVISION_PUBLIC_DEMO_DAILY_LIMIT",
                "Value": {
                  "Ref": "PublicDemoDailyLimit"
                }
              },
              {
                "Name": "AUTOVISION_VISION_URL",
                "Value": {
                  "Fn::If": [
                    "UseCool",
                    {
                      "Ref": "CoolVisionUrl"
                    },
                    "http://localhost:8000"
                  ]
                }
              },
              {
                "Name": "AUTOVISION_VISION_BACKEND",
                "Value": {
                  "Ref": "VisionBackend"
                }
              },
              {
                "Name": "AUTOVISION_PUBLIC_ORIGIN",
                "Value": {
                  "Ref": "PublicOrigin"
                }
              },
              {
                "Name": "AUTOVISION_BLOCKED_SIGNUP_DOMAINS",
                "Value": {
                  "Ref": "BlockedSignupDomains"
                }
              },
              {
                "Name": "AUTOVISION_CORE_SECRETS_REVISION",
                "Value": {
