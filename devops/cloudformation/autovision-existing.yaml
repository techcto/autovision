          "HostedZoneId": {
            "Ref": "LoadBalancerCanonicalHostedZoneId"
          },
          "EvaluateTargetHealth": false
        }
      }
    },
    "VisionBedrockAccess": {
      "Type": "AWS::IAM::Policy",
      "Condition": "UseVisionAI",
      "Properties": {
        "PolicyName": "NovaLiteImageGrounding",
        "Roles": [
          {
            "Ref": "TaskRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "bedrock:InvokeModel",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0"
              }
            },
            {
              "Effect": "Allow",
              "Action": "bedrock:InvokeModel",
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-lite-v1:0"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-lite-v1:0"
                }
              ],
              "Condition": {
                "StringEquals": {
                  "bedrock:InferenceProfileArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0"
                  }
                }
              }
            }
          ]
        }
      }
    },
    "StripeCredentials": {
      "Type": "AWS::SecretsManager::Secret",
      "Condition": "CreateStripeSecret",
      "DeletionPolicy": "RetainExceptOnCreate",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} Stripe credentials; separate live and sandbox deployments"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseStripeKmsKey",
            {
              "Ref": "StripeCredentialsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Fn::Sub": "{\"secret_key\":\"${StripeSecretKey}\",\"webhook_secret\":\"${StripeWebhookSecret}\"}"
        }
      }
    },
    "RootPasswordSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "DeletionPolicy": "RetainExceptOnCreate",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} RootPassword; preserve value during migration"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseCoreSecretsKmsKey",
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Ref": "RootPassword"
        }
      }
    },
    "SessionSigningSecret": {
      "Type": "AWS::SecretsManager::Secret",
      "DeletionPolicy": "RetainExceptOnCreate",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Description": {
          "Fn::Sub": "${AWS::StackName} SessionSecret; preserve value during migration"
        },
        "KmsKeyId": {
          "Fn::If": [
            "UseCoreSecretsKmsKey",
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            {
              "Ref": "AWS::NoValue"
            }
          ]
        },
        "SecretString": {
          "Ref": "SessionSecret"
        }
      }
    }
  },
  "Outputs": {
    "URL": {
      "Value": {
        "Fn::Sub": "https://${HostHeader}"
      }
    },
    "Table": {
      "Value": {
        "Ref": "AppTable"
      }
    },
    "EventBusName": {
      "Value": {
        "Fn::If": [
          "UseEventBridge",
          {
            "Ref": "EventBus"
          },
          "disabled-direct-sqs"
        ]
      }
    },
    "EvidenceBucketName": {
      "Value": {
        "Ref": "EvidenceBucket"
      }
    },
    "VisionBackend": {
      "Description": "Requested backend; COOL mode requires separately verified licensed Arm workload.",
      "Value": {
        "Ref": "VisionBackend"
      }
    },
    "StripeCredentialsSecretArn": {
      "Condition": "UseStripeCredentials",
      "Description": "Stripe secret ARN only; values are never output.",
      "Value": {
        "Fn::If": [
          "UseExternalStripeSecret",
          {
            "Ref": "StripeCredentialsSecretArn"
          },
          {
            "Ref": "StripeCredentials"
          }
        ]
      }
    },
    "RootPasswordSecretArn": {
      "Description": "Secret ARN only; never the credential value.",
      "Value": {
        "Ref": "RootPasswordSecret"
      }
    },
    "SessionSigningSecretArn": {
      "Description": "Secret ARN only; never the credential value.",
      "Value": {
        "Ref": "SessionSigningSecret"
      }
    }
  },
  "Conditions": {
    "UseBedrock": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "BedrockModelArn"
            },
            ""
          ]
        }
      ]
    },
    "AttachCertificate": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CertificateArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateDns": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "HostedZoneId"
            },
            ""
          ]
        }
      ]
    },
    "UseEventBridge": {
      "Fn::Equals": [
        {
          "Ref": "EventBridgeEnabled"
        },
        "true"
      ]
    },
    "UseVisionAI": {
      "Fn::Equals": [
        {
          "Ref": "VisionAIEnabled"
        },
        "true"
      ]
    },
    "UseCool": {
      "Fn::Equals": [
        {
          "Ref": "VisionBackend"
        },
        "cool"
      ]
    },
    "UseExternalStripeSecret": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateStripeSecret": {
      "Fn::And": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsSecretArn"
            },
            ""
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeCredentials": {
      "Fn::Or": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsSecretArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeSecretKey"
                },
                ""
              ]
            }
          ]
        }
      ]
    },
    "UseStripeKmsKey": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "StripeCredentialsKmsKeyArn"
            },
            ""
          ]
        }
      ]
    },
    "UseStripeKmsAccess": {
      "Fn::And": [
        {
          "Fn::Not": [
            {
              "Fn::Equals": [
                {
                  "Ref": "StripeCredentialsKmsKeyArn"
                },
                ""
              ]
            }
          ]
        },
        {
          "Fn::Or": [
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeCredentialsSecretArn"
                    },
                    ""
                  ]
                }
              ]
            },
            {
              "Fn::Not": [
                {
                  "Fn::Equals": [
                    {
                      "Ref": "StripeSecretKey"
                    },
                    ""
                  ]
                }
              ]
            }
          ]
        }
      ]
    },
    "UseCoreSecretsKmsKey": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CoreSecretsKmsKeyArn"
            },
            ""
          ]
        }
      ]
    }
  },
  "Rules": {
    "DnsRequiresAlb": {
      "RuleCondition": {
        "Fn::Not": [
          {
            "Fn::Equals": [
              {
                "Ref": "HostedZoneId"
              },
              ""
            ]
          }
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "LoadBalancerDnsName"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "Supply LoadBalancerDnsName with HostedZoneId."
        },
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "LoadBalancerCanonicalHostedZoneId"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "Supply LoadBalancerCanonicalHostedZoneId with HostedZoneId."
        }
      ]
    },
    "CoolRequiresEndpoint": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "VisionBackend"
          },
          "cool"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "CoolVisionUrl"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "Supply the licensed COOL/Graviton service private endpoint when VisionBackend=cool."
        }
      ]
    },
    "StripeCredentialSource": {
      "Assertions": [
        {
          "Assert": {
            "Fn::Or": [
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeSecretKey"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeWebhookSecret"
                      },
                      ""
                    ]
                  }
                ]
              },
              {
                "Fn::And": [
                  {
                    "Fn::Equals": [
                      {
                        "Ref": "StripeCredentialsSecretArn"
                      },
                      ""
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeSecretKey"
                          },
                          ""
                        ]
                      }
                    ]
                  },
                  {
                    "Fn::Not": [
                      {
                        "Fn::Equals": [
                          {
                            "Ref": "StripeWebhookSecret"
                          },
                          ""
                        ]
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "AssertDescription": "Supply both raw Stripe credentials or an existing secret ARN, never partial credentials or both sources."
        }
      ]
    },
    "SaasEmailSenderRequired": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "DeploymentMode"
          },
          "saas"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "SesFrom"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "SaaS mode requires an SES-verified sender for account verification."
        },
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "PublicOrigin"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "SaaS mode requires a canonical HTTPS origin for authentication emails."
        }
      ]
    }
  }
}

