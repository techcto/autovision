    "ApiService": {
      "Type": "AWS::ECS::Service",
      "DependsOn": "ApiRule",
      "Properties": {
        "Cluster": {
          "Ref": "Cluster"
        },
        "LaunchType": "FARGATE",
        "DesiredCount": {
          "Ref": "DesiredCount"
        },
        "TaskDefinition": {
          "Ref": "ApiTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        },
        "HealthCheckGracePeriodSeconds": 60,
        "LoadBalancers": [
          {
            "ContainerName": "api",
            "ContainerPort": 3001,
            "TargetGroupArn": {
              "Ref": "ApiTarget"
            }
          }
        ]
      }
    },
    "WorkerTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "1024",
        "Memory": "2048",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "worker",
            "Image": {
              "Fn::Sub": "${ImageBase}-worker:${ReleaseVersion}"
            },
            "Essential": true,
            "Environment": [
              {
                "Name": "NODE_ENV",
                "Value": "production"
              },
              {
                "Name": "AUTOVISION_TABLE",
                "Value": {
                  "Ref": "AppTable"
                }
              },
              {
                "Name": "AUTOVISION_DEPLOYMENT_MODE",
                "Value": {
                  "Ref": "DeploymentMode"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_USER",
                "Value": {
                  "Ref": "RootUsername"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_PASSWORD",
                "Value": {
                  "Ref": "RootPassword"
                }
              },
              {
                "Name": "AUTOVISION_SESSION_SECRET",
                "Value": {
                  "Ref": "SessionSecret"
                }
              },
              {
                "Name": "AUTOVISION_QUEUE_URL",
                "Value": {
                  "Ref": "Queue"
                }
              },
              {
                "Name": "AUTOVISION_EVIDENCE_BUCKET",
                "Value": {
                  "Ref": "EvidenceBucket"
                }
              },
              {
                "Fn::If": [
                  "UseEventBridge",
                  {
                    "Name": "AUTOVISION_EVENT_BUS",
                    "Value": {
                      "Ref": "EventBus"
                    }
                  },
                  {
                    "Ref": "AWS::NoValue"
                  }
                ]
              },
              {
                "Name": "STRIPE_SECRET_KEY",
                "Value": {
                  "Ref": "StripeSecretKey"
                }
              },
              {
                "Name": "STRIPE_WEBHOOK_SECRET",
                "Value": {
                  "Ref": "StripeWebhookSecret"
                }
              },
              {
                "Name": "STRIPE_STARTER_PRICE_ID",
                "Value": {
                  "Ref": "StripeStarterPriceId"
                }
              },
              {
                "Name": "STRIPE_SCALE_PRICE_ID",
                "Value": {
                  "Ref": "StripeScalePriceId"
                }
              },
              {
                "Name": "AUTOVISION_SES_FROM",
                "Value": {
                  "Ref": "SesFrom"
                }
              },
              {
                "Name": "AUTOVISION_WHATSAPP_ORIGINATION_ID",
                "Value": {
                  "Ref": "WhatsappOriginationId"
                }
              },
              {
                "Name": "AUTOVISION_NOTIFICATION_RECIPIENTS",
                "Value": {
                  "Ref": "NotificationRecipients"
                }
              },
              {
                "Name": "AUTOVISION_VISION_URL",
                "Value": {
                  "Fn::If": [
                    "UseCool",
                    {
                      "Ref": "CoolVisionUrl"
                    },
                    "http://localhost:8000"
                  ]
                }
              },
              {
                "Name": "BEDROCK_MODEL_ID",
                "Value": {
                  "Ref": "BedrockModelId"
                }
              },
              {
                "Name": "AUTOVISION_NOTIFICATION_MODE",
                "Value": "aws"
              },
              {
                "Name": "AUTOVISION_VISION_BACKEND",
                "Value": {
                  "Ref": "VisionBackend"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "LogGroup"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "worker"
              }
            }
          },
          {
            "Fn::If": [
              "UseCool",
              {
                "Ref": "AWS::NoValue"
              },
              {
                "Name": "vision",
                "Image": {
                  "Fn::Sub": "${ImageBase}-vision:${ReleaseVersion}"
                },
                "Essential": true,
                "PortMappings": [
                  {
                    "ContainerPort": 8000
                  }
                ],
                "LogConfiguration": {
                  "LogDriver": "awslogs",
                  "Options": {
                    "awslogs-group": {
                      "Ref": "LogGroup"
                    },
                    "awslogs-region": {
                      "Ref": "AWS::Region"
                    },
                    "awslogs-stream-prefix": "vision"
                  }
                }
              }
            ]
          }
        ]
      }
    },
    "WorkerService": {
      "Type": "AWS::ECS::Service",
      "Properties": {
        "Cluster": {
          "Ref": "Cluster"
        },
        "LaunchType": "FARGATE",
        "DesiredCount": {
          "Ref": "DesiredCount"
        },
        "TaskDefinition": {
          "Ref": "WorkerTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        }
      }
    },
    "BedrockAccess": {
      "Type": "AWS::IAM::Policy",
      "Condition": "UseBedrock",
      "Properties": {
        "PolicyName": "autovision-bedrock",
        "Roles": [
          {
            "Ref": "TaskRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "bedrock:InvokeModel",
              "Resource": {
                "Ref": "BedrockModelArn"
              }
            }
          ]
        }
      }
    },
    "IncidentRule": {
      "Type": "AWS::Events::Rule",
      "Properties": {
        "EventBusName": {
          "Ref": "EventBus"
        },
        "EventPattern": {
          "source": [
            "autovision"
          ],
          "detail-type": [
            "IncidentCreated"
          ]
        },
        "Targets": [
          {
            "Id": "IncidentQueue",
            "Arn": {
              "Fn::GetAtt": [
                "Queue",
                "Arn"
              ]
            }
          }
        ]
      },
      "Condition": "UseEventBridge"
    },
    "QueuePolicy": {
      "Type": "AWS::SQS::QueuePolicy",
      "Properties": {
        "Queues": [
          {
            "Ref": "Queue"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "events.amazonaws.com"
              },
              "Action": "sqs:SendMessage",
              "Resource": {
                "Fn::GetAtt": [
                  "Queue",
                  "Arn"
                ]
              },
              "Condition": {
                "ArnEquals": {
                  "aws:SourceArn": {
                    "Fn::GetAtt": [
                      "IncidentRule",
                      "Arn"
                    ]
                  }
                }
              }
            }
          ]
        }
      },
      "Condition": "UseEventBridge"
    },
    "ApplicationDns": {
      "Type": "AWS::Route53::RecordSet",
      "Condition": "CreateDns",
      "Properties": {
        "HostedZoneId": {
          "Ref": "HostedZoneId"
        },
        "Name": {
          "Ref": "DomainName"
        },
        "Type": "A",
        "AliasTarget": {
          "DNSName": {
            "Fn::GetAtt": [
              "ALB",
              "DNSName"
            ]
          },
          "HostedZoneId": {
            "Fn::GetAtt": [
              "ALB",
              "CanonicalHostedZoneID"
            ]
          }
        }
      }
    },
    "VisionBedrockAccess": {
      "Type": "AWS::IAM::Policy",
      "Condition": "UseVisionAI",
      "Properties": {
        "PolicyName": "NovaLiteImageGrounding",
        "Roles": [
          {
            "Ref": "TaskRole"
          }
        ],
        "PolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": "bedrock:InvokeModel",
              "Resource": {
                "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0"
              }
            },
            {
              "Effect": "Allow",
              "Action": "bedrock:InvokeModel",
              "Resource": [
                {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1::foundation-model/amazon.nova-lite-v1:0"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-2::foundation-model/amazon.nova-lite-v1:0"
                },
                {
                  "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-west-2::foundation-model/amazon.nova-lite-v1:0"
                }
              ],
              "Condition": {
                "StringEquals": {
                  "bedrock:InferenceProfileArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.amazon.nova-lite-v1:0"
                  }
                }
              }
            }
          ]
        }
      }
    }
  },
  "Outputs": {
    "URL": {
      "Value": {
        "Fn::If": [
          "UseTLS",
          {
            "Fn::Sub": "https://${ALB.DNSName}"
          },
          {
            "Fn::Sub": "http://${ALB.DNSName}"
          }
        ]
      }
    },
    "Table": {
      "Value": {
        "Ref": "AppTable"
      }
    },
    "EventBusName": {
      "Value": {
        "Fn::If": [
          "UseEventBridge",
          {
            "Ref": "EventBus"
          },
          "disabled-direct-sqs"
        ]
      }
    },
    "EvidenceBucketName": {
      "Value": {
        "Ref": "EvidenceBucket"
      }
    },
    "ApplicationDomain": {
      "Value": {
        "Ref": "DomainName"
      }
    },
    "VisionBackend": {
      "Description": "Requested backend; COOL mode requires separately verified licensed Arm workload.",
      "Value": {
        "Ref": "VisionBackend"
      }
    }
  },
  "Rules": {
    "CoolRequiresEndpoint": {
      "RuleCondition": {
        "Fn::Equals": [
          {
            "Ref": "VisionBackend"
          },
          "cool"
        ]
      },
      "Assertions": [
        {
          "Assert": {
            "Fn::Not": [
              {
                "Fn::Equals": [
                  {
                    "Ref": "CoolVisionUrl"
                  },
                  ""
                ]
              }
            ]
          },
          "AssertDescription": "Supply the licensed COOL/Graviton service private endpoint when VisionBackend=cool."
        }
      ]
    }
  }
}

