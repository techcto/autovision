{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "AutoVision SaaS or private application on ECS Fargate",
  "Parameters": {
    "VpcId": {
      "Type": "AWS::EC2::VPC::Id"
    },
    "PublicSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "PrivateSubnets": {
      "Type": "List<AWS::EC2::Subnet::Id>"
    },
    "ImageBase": {
      "Type": "String",
      "Description": "ECR registry/repository prefix without service suffix"
    },
    "ReleaseVersion": {
      "Type": "String",
      "AllowedPattern": "[0-9A-Za-z.-]+",
      "Description": "Immutable published image tag"
    },
    "CertificateArn": {
      "Type": "String",
      "Default": ""
    },
    "RootUsername": {
      "Type": "String",
      "Default": "root",
      "MinLength": 3
    },
    "RootPassword": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 12
    },
    "SessionSecret": {
      "Type": "String",
      "NoEcho": true,
      "MinLength": 32
    },
    "DeploymentMode": {
      "Type": "String",
      "Default": "on-premise",
      "AllowedValues": [
        "on-premise",
        "saas"
      ]
    },
    "DesiredCount": {
      "Type": "Number",
      "Default": 1,
      "MinValue": 1
    },
    "StripeSecretKey": {
      "Type": "String",
      "NoEcho": true,
      "Default": ""
    },
    "StripeWebhookSecret": {
      "Type": "String",
      "NoEcho": true,
      "Default": ""
    },
    "StripeStarterPriceId": {
      "Type": "String",
      "Default": ""
    },
    "StripeScalePriceId": {
      "Type": "String",
      "Default": ""
    },
    "SesFrom": {
      "Type": "String",
      "Default": ""
    },
    "WhatsappOriginationId": {
      "Type": "String",
      "Default": ""
    },
    "NotificationRecipients": {
      "Type": "String",
      "Default": ""
    },
    "BedrockModelId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional Bedrock model/inference-profile ID for enrichment"
    },
    "BedrockModelArn": {
      "Type": "String",
      "Default": "",
      "Description": "ARN authorized for bedrock:InvokeModel; include inference profiles as required"
    },
    "DomainName": {
      "Type": "String",
      "Default": "autovision.dev",
      "Description": "Public application domain; certificate must cover this name"
    },
    "HostedZoneId": {
      "Type": "String",
      "Default": "",
      "Description": "Optional Route 53 public zone for the application alias"
    },
    "MarketplaceUrl": {
      "Type": "String",
      "Default": "https://aws.amazon.com/marketplace/pp/prodview-f4z2vbrqoh55u",
      "AllowedPattern": "^$|^https://aws\\.amazon\\.com/marketplace/[^\\s]+$",
      "Description": "Buyer-facing Marketplace listing URL. Leave empty to hide the subscription button."
    },
    "EventBridgeEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Use EventBridge to deliver incidents. Set false for direct SQS delivery."
    },
    "VisionAIEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Enable Nova Lite scene grounding; incurs bounded per-request Bedrock charges. US inference profile; deploy in us-east-1."
    },
    "PublicDemoEnabled": {
      "Type": "String",
      "Default": "true",
      "AllowedValues": [
        "true",
        "false"
      ],
      "Description": "Enable anonymous bounded image/video sample analysis"
    },
    "PublicDemoDailyLimit": {
      "Type": "Number",
      "Default": 100,
      "MinValue": 1,
      "MaxValue": 10000
    },
    "VisionBackend": {
      "Type": "String",
      "Default": "standard",
      "AllowedValues": [
        "standard",
        "cool"
      ],
      "Description": "standard uses the bundled OpenCV vision sidecar; cool uses a separately provisioned, licensed COOL/Graviton service. No automatic Marketplace subscription."
    },
    "CoolVisionUrl": {
      "Type": "String",
      "Default": "",
      "AllowedPattern": "^$|^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$",
      "Description": "Private base URL of a verified COOL service implementing /analyze and /detect. Restrict network access to app task security groups. Required only for cool."
    }
  },
  "Conditions": {
    "UseTLS": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "CertificateArn"
            },
            ""
          ]
        }
      ]
    },
    "UseBedrock": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "BedrockModelArn"
            },
            ""
          ]
        }
      ]
    },
    "CreateDns": {
      "Fn::Not": [
        {
          "Fn::Equals": [
            {
              "Ref": "HostedZoneId"
            },
            ""
          ]
        }
      ]
    },
    "UseEventBridge": {
      "Fn::Equals": [
        {
          "Ref": "EventBridgeEnabled"
        },
        "true"
      ]
    },
    "UseVisionAI": {
      "Fn::Equals": [
        {
          "Ref": "VisionAIEnabled"
        },
        "true"
      ]
    },
    "UseCool": {
      "Fn::Equals": [
        {
          "Ref": "VisionBackend"
        },
        "cool"
      ]
    }
  },
  "Resources": {
    "Cluster": {
      "Type": "AWS::ECS::Cluster",
      "Properties": {
        "ClusterSettings": [
          {
            "Name": "containerInsights",
            "Value": "enabled"
          }
        ]
      }
    },
    "ALBSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "AutoVision public ingress",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 80,
            "ToPort": 80,
            "CidrIp": "0.0.0.0/0"
          },
          {
            "IpProtocol": "tcp",
            "FromPort": 443,
            "ToPort": 443,
            "CidrIp": "0.0.0.0/0"
          }
        ]
      }
    },
    "ServiceSG": {
      "Type": "AWS::EC2::SecurityGroup",
      "Properties": {
        "GroupDescription": "AutoVision application tasks",
        "VpcId": {
          "Ref": "VpcId"
        },
        "SecurityGroupIngress": [
          {
            "IpProtocol": "tcp",
            "FromPort": 3000,
            "ToPort": 3001,
            "SourceSecurityGroupId": {
              "Ref": "ALBSG"
            }
          }
        ]
      }
    },
    "ALB": {
      "Type": "AWS::ElasticLoadBalancingV2::LoadBalancer",
      "Properties": {
        "Subnets": {
          "Ref": "PublicSubnets"
        },
        "SecurityGroups": [
          {
            "Ref": "ALBSG"
          }
        ]
      }
    },
    "WebTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3000,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      }
    },
    "ApiTarget": {
      "Type": "AWS::ElasticLoadBalancingV2::TargetGroup",
      "Properties": {
        "VpcId": {
          "Ref": "VpcId"
        },
        "Port": 3001,
        "Protocol": "HTTP",
        "TargetType": "ip",
        "HealthCheckPath": "/api/health"
      }
    },
    "Listener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 80,
        "Protocol": "HTTP",
        "DefaultActions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "WebTarget"
                }
              }
            ]
          }
        ]
      }
    },
    "ApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Properties": {
        "ListenerArn": {
          "Ref": "Listener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*",
              "/mcp",
              "/mcp/*"
            ]
          }
        ],
        "Actions": [
          {
            "Fn::If": [
              "UseTLS",
              {
                "Type": "redirect",
                "RedirectConfig": {
                  "Protocol": "HTTPS",
                  "Port": "443",
                  "StatusCode": "HTTP_301"
                }
              },
              {
                "Type": "forward",
                "TargetGroupArn": {
                  "Ref": "ApiTarget"
                }
              }
            ]
          }
        ]
      }
    },
    "HttpsListener": {
      "Type": "AWS::ElasticLoadBalancingV2::Listener",
      "Condition": "UseTLS",
      "Properties": {
        "LoadBalancerArn": {
          "Ref": "ALB"
        },
        "Port": 443,
        "Protocol": "HTTPS",
        "Certificates": [
          {
            "CertificateArn": {
              "Ref": "CertificateArn"
            }
          }
        ],
        "DefaultActions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "WebTarget"
            }
          }
        ]
      }
    },
    "HttpsApiRule": {
      "Type": "AWS::ElasticLoadBalancingV2::ListenerRule",
      "Condition": "UseTLS",
      "Properties": {
        "ListenerArn": {
          "Ref": "HttpsListener"
        },
        "Priority": 10,
        "Conditions": [
          {
            "Field": "path-pattern",
            "Values": [
              "/api/*",
              "/mcp",
              "/mcp/*"
            ]
          }
        ],
        "Actions": [
          {
            "Type": "forward",
            "TargetGroupArn": {
              "Ref": "ApiTarget"
            }
          }
        ]
      }
    },
    "Queue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "VisibilityTimeout": 120,
        "MessageRetentionPeriod": 345600,
        "RedrivePolicy": {
          "deadLetterTargetArn": {
            "Fn::GetAtt": [
              "DeadLetterQueue",
              "Arn"
            ]
          },
          "maxReceiveCount": 5
        }
      }
    },
    "DeadLetterQueue": {
      "Type": "AWS::SQS::Queue",
      "Properties": {
        "MessageRetentionPeriod": 1209600
      }
    },
    "AppTable": {
      "Type": "AWS::DynamoDB::Table",
      "Properties": {
        "BillingMode": "PAY_PER_REQUEST",
        "AttributeDefinitions": [
          {
            "AttributeName": "pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "sk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1pk",
            "AttributeType": "S"
          },
          {
            "AttributeName": "gsi1sk",
            "AttributeType": "S"
          }
        ],
        "KeySchema": [
          {
            "AttributeName": "pk",
            "KeyType": "HASH"
          },
          {
            "AttributeName": "sk",
            "KeyType": "RANGE"
          }
        ],
        "GlobalSecondaryIndexes": [
          {
            "IndexName": "GSI1",
            "KeySchema": [
              {
                "AttributeName": "gsi1pk",
                "KeyType": "HASH"
              },
              {
                "AttributeName": "gsi1sk",
                "KeyType": "RANGE"
              }
            ],
            "Projection": {
              "ProjectionType": "ALL"
            }
          }
        ],
        "TimeToLiveSpecification": {
          "AttributeName": "ttl",
          "Enabled": true
        },
        "PointInTimeRecoverySpecification": {
          "PointInTimeRecoveryEnabled": true
        },
        "SSESpecification": {
          "SSEEnabled": true
        }
      }
    },
    "EvidenceBucket": {
      "Type": "AWS::S3::Bucket",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "BucketEncryption": {
          "ServerSideEncryptionConfiguration": [
            {
              "ServerSideEncryptionByDefault": {
                "SSEAlgorithm": "AES256"
              }
            }
          ]
        },
        "PublicAccessBlockConfiguration": {
          "BlockPublicAcls": true,
          "BlockPublicPolicy": true,
          "IgnorePublicAcls": true,
          "RestrictPublicBuckets": true
        }
      }
    },
    "EventBus": {
      "Type": "AWS::Events::EventBus",
      "Properties": {
        "Name": {
          "Fn::Sub": "${AWS::StackName}-events"
        }
      },
      "Condition": "UseEventBridge"
    },
    "LogGroup": {
      "Type": "AWS::Logs::LogGroup",
      "Properties": {
        "RetentionInDays": 30
      }
    },
    "ExecutionRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "ManagedPolicyArns": [
          {
            "Fn::Sub": "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
          }
        ]
      }
    },
    "TaskRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "ecs-tasks.amazonaws.com"
              },
              "Action": "sts:AssumeRole"
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "autovision-data",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": [
                    "dynamodb:GetItem",
                    "dynamodb:PutItem",
                    "dynamodb:DeleteItem",
                    "dynamodb:Query",
                    "dynamodb:UpdateItem"
                  ],
                  "Resource": [
                    {
                      "Fn::GetAtt": [
                        "AppTable",
                        "Arn"
                      ]
                    },
                    {
                      "Fn::Sub": "${AppTable.Arn}/index/*"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "sqs:SendMessage",
                    "sqs:ReceiveMessage",
                    "sqs:DeleteMessage",
                    "sqs:GetQueueAttributes"
                  ],
                  "Resource": {
                    "Fn::GetAtt": [
                      "Queue",
                      "Arn"
                    ]
                  }
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "s3:GetObject",
                    "s3:PutObject"
                  ],
                  "Resource": {
                    "Fn::Sub": "${EvidenceBucket.Arn}/*"
                  }
                },
                {
                  "Fn::If": [
                    "UseEventBridge",
                    {
                      "Effect": "Allow",
                      "Action": "events:PutEvents",
                      "Resource": {
                        "Fn::GetAtt": [
                          "EventBus",
                          "Arn"
                        ]
                      }
                    },
                    {
                      "Ref": "AWS::NoValue"
                    }
                  ]
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ses:SendEmail",
                    "social-messaging:SendWhatsAppMessage"
                  ],
                  "Resource": "*"
                }
              ]
            }
          }
        ]
      }
    },
    "WebTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "256",
        "Memory": "512",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "web",
            "Image": {
              "Fn::Sub": "${ImageBase}-web:${ReleaseVersion}"
            },
            "Essential": true,
            "PortMappings": [
              {
                "ContainerPort": 3000
              }
            ],
            "Environment": [
              {
                "Name": "NODE_ENV",
                "Value": "production"
              },
              {
                "Name": "AUTOVISION_TABLE",
                "Value": {
                  "Ref": "AppTable"
                }
              },
              {
                "Name": "AUTOVISION_DEPLOYMENT_MODE",
                "Value": {
                  "Ref": "DeploymentMode"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_USER",
                "Value": {
                  "Ref": "RootUsername"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_PASSWORD",
                "Value": {
                  "Ref": "RootPassword"
                }
              },
              {
                "Name": "AUTOVISION_SESSION_SECRET",
                "Value": {
                  "Ref": "SessionSecret"
                }
              },
              {
                "Name": "AUTOVISION_QUEUE_URL",
                "Value": {
                  "Ref": "Queue"
                }
              },
              {
                "Name": "AUTOVISION_EVIDENCE_BUCKET",
                "Value": {
                  "Ref": "EvidenceBucket"
                }
              },
              {
                "Fn::If": [
                  "UseEventBridge",
                  {
                    "Name": "AUTOVISION_EVENT_BUS",
                    "Value": {
                      "Ref": "EventBus"
                    }
                  },
                  {
                    "Ref": "AWS::NoValue"
                  }
                ]
              },
              {
                "Name": "STRIPE_SECRET_KEY",
                "Value": {
                  "Ref": "StripeSecretKey"
                }
              },
              {
                "Name": "STRIPE_WEBHOOK_SECRET",
                "Value": {
                  "Ref": "StripeWebhookSecret"
                }
              },
              {
                "Name": "STRIPE_STARTER_PRICE_ID",
                "Value": {
                  "Ref": "StripeStarterPriceId"
                }
              },
              {
                "Name": "STRIPE_SCALE_PRICE_ID",
                "Value": {
                  "Ref": "StripeScalePriceId"
                }
              },
              {
                "Name": "AUTOVISION_SES_FROM",
                "Value": {
                  "Ref": "SesFrom"
                }
              },
              {
                "Name": "AUTOVISION_WHATSAPP_ORIGINATION_ID",
                "Value": {
                  "Ref": "WhatsappOriginationId"
                }
              },
              {
                "Name": "AUTOVISION_NOTIFICATION_RECIPIENTS",
                "Value": {
                  "Ref": "NotificationRecipients"
                }
              },
              {
                "Name": "PORT",
                "Value": "3000"
              },
              {
                "Name": "BEDROCK_MODEL_ID",
                "Value": {
                  "Ref": "BedrockModelId"
                }
              },
              {
                "Name": "AUTOVISION_NOTIFICATION_MODE",
                "Value": "aws"
              },
              {
                "Name": "AUTOVISION_MARKETPLACE_URL",
                "Value": {
                  "Ref": "MarketplaceUrl"
                }
              },
              {
                "Name": "AUTOVISION_VISION_MODEL_ID",
                "Value": {
                  "Fn::If": [
                    "UseVisionAI",
                    "us.amazon.nova-lite-v1:0",
                    ""
                  ]
                }
              },
              {
                "Name": "AUTOVISION_AI_DETECTIONS",
                "Value": "package"
              },
              {
                "Name": "AUTOVISION_PUBLIC_DEMO_ENABLED",
                "Value": {
                  "Ref": "PublicDemoEnabled"
                }
              },
              {
                "Name": "AUTOVISION_PUBLIC_DEMO_DAILY_LIMIT",
                "Value": {
                  "Ref": "PublicDemoDailyLimit"
                }
              },
              {
                "Name": "AUTOVISION_VISION_URL",
                "Value": {
                  "Fn::If": [
                    "UseCool",
                    {
                      "Ref": "CoolVisionUrl"
                    },
                    "http://localhost:8000"
                  ]
                }
              },
              {
                "Name": "AUTOVISION_VISION_BACKEND",
                "Value": {
                  "Ref": "VisionBackend"
                }
              }
            ],
            "LogConfiguration": {
              "LogDriver": "awslogs",
              "Options": {
                "awslogs-group": {
                  "Ref": "LogGroup"
                },
                "awslogs-region": {
                  "Ref": "AWS::Region"
                },
                "awslogs-stream-prefix": "web"
              }
            }
          }
        ]
      }
    },
    "WebService": {
      "Type": "AWS::ECS::Service",
      "DependsOn": "Listener",
      "Properties": {
        "Cluster": {
          "Ref": "Cluster"
        },
        "LaunchType": "FARGATE",
        "DesiredCount": {
          "Ref": "DesiredCount"
        },
        "TaskDefinition": {
          "Ref": "WebTask"
        },
        "NetworkConfiguration": {
          "AwsvpcConfiguration": {
            "AssignPublicIp": "DISABLED",
            "Subnets": {
              "Ref": "PrivateSubnets"
            },
            "SecurityGroups": [
              {
                "Ref": "ServiceSG"
              }
            ]
          }
        },
        "HealthCheckGracePeriodSeconds": 60,
        "LoadBalancers": [
          {
            "ContainerName": "web",
            "ContainerPort": 3000,
            "TargetGroupArn": {
              "Ref": "WebTarget"
            }
          }
        ]
      }
    },
    "ApiTask": {
      "Type": "AWS::ECS::TaskDefinition",
      "Properties": {
        "RequiresCompatibilities": [
          "FARGATE"
        ],
        "NetworkMode": "awsvpc",
        "Cpu": "1024",
        "Memory": "2048",
        "ExecutionRoleArn": {
          "Fn::GetAtt": [
            "ExecutionRole",
            "Arn"
          ]
        },
        "TaskRoleArn": {
          "Fn::GetAtt": [
            "TaskRole",
            "Arn"
          ]
        },
        "ContainerDefinitions": [
          {
            "Name": "api",
            "Image": {
              "Fn::Sub": "${ImageBase}-api:${ReleaseVersion}"
            },
            "Essential": true,
            "PortMappings": [
              {
                "ContainerPort": 3001
              }
            ],
            "Environment": [
              {
                "Name": "NODE_ENV",
                "Value": "production"
              },
              {
                "Name": "AUTOVISION_TABLE",
                "Value": {
                  "Ref": "AppTable"
                }
              },
              {
                "Name": "AUTOVISION_DEPLOYMENT_MODE",
                "Value": {
                  "Ref": "DeploymentMode"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_USER",
                "Value": {
                  "Ref": "RootUsername"
                }
              },
              {
                "Name": "AUTOVISION_ROOT_PASSWORD",
                "Value": {
                  "Ref": "RootPassword"
                }
              },
              {
                "Name": "AUTOVISION_SESSION_SECRET",
                "Value": {
                  "Ref": "SessionSecret"
                }
              },
              {
                "Name": "AUTOVISION_QUEUE_URL",
                "Value": {
                  "Ref": "Queue"
                }
              },
              {
                "Name": "AUTOVISION_EVIDENCE_BUCKET",
                "Value": {
                  "Ref": "EvidenceBucket"
                }
              },
              {
                "Fn::If": [
                  "UseEventBridge",
                  {
                    "Name": "AUTOVISION_EVENT_BUS",
                    "Value": {
                      "Ref": "EventBus"
                    }
                  },
                  {
                    "Ref": "AWS::NoValue"
                  }
                ]
              },
              {
                "Name": "STRIPE_SECRET_KEY",
                "Value": {
                  "Ref": "StripeSecretKey"
                }
              },
              {
                "Name": "STRIPE_WEBHOOK_SECRET",
                "Value": {
                  "Ref": "StripeWebhookSecret"
