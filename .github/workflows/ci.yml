name: AutoVision CI
on:
  pull_request:
  push:
    branches: [main, master]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 26, cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build
      - run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install cfn-lint
      - run: cfn-lint devops/cloudformation/*.yaml
      - run: bash -n devops/changeset.sh
      - run: DRY_RUN=1 MP_AWS_MARKETPLACE_PRODUCT_ID=synthetic-product MP_AWS_ECR=example.invalid RELEASE_VERSION=0.1.0 bash devops/changeset.sh > /tmp/changeset.json
      - run: docker network create application-platforms-local
      - run: docker compose build
      - run: docker compose run --rm --no-deps autovision-vision python -m unittest discover -s src/vision -v
      - run: docker compose run --rm --no-deps autovision-vision python src/vision/evaluate.py


